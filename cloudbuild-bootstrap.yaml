#
# Runs database migrations via a Cloud Run Job (which has VPC access to
# the private Cloud SQL instance). No proxy or public IP needed.

steps:
  # 1. Get the latest backend image from the Cloud Run service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Update Job Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_IMAGE=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --format='value(spec.template.spec.containers[0].image)') && \
        gcloud run jobs update ${_JOB_NAME} \
          --image="$$BACKEND_IMAGE" \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --quiet

  # 2. Execute the migration job and wait for completion
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Run Migrations'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - '${_JOB_NAME}'
      - '--region=${_REGION}'
      - '--wait'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'europe-west1'
  _JOB_NAME: 'cstudio-db-migrate'
  _BACKEND_SERVICE: 'cstudio-backend-secdev'
